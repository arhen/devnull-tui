id = "devnull.feed"
name = "devnull-tui"
version = "0.3.1"
min_herdr_version = "0.9.0"
description = "Unofficial terminal UI for /dev/null, in a Herdr pane"
platforms = ["linux", "macos"]

[[panes]]
id = "feed"
title = "/dev/null"
placement = "split"
command = ["/bin/sh", "run.sh"]

[[actions]]
id = "open"
title = "Open the /dev/null feed"
contexts = ["pane", "workspace"]
command = ["/bin/sh", "open.sh"]

[[actions]]
id = "latest"
title = "Print the /dev/null Latest log"
contexts = ["pane", "workspace"]
command = ["/bin/sh", "run.sh", "--once", "--log", "latest"]

[[actions]]
id = "trending"
title = "Print the /dev/null Trending log"
contexts = ["pane", "workspace"]
command = ["/bin/sh", "run.sh", "--once", "--log", "trending"]

[[actions]]
id = "following"
title = "Print the /dev/null Following log"
contexts = ["pane", "workspace"]
command = ["/bin/sh", "run.sh", "--once", "--log", "following"]

[[actions]]
id = "notifications"
title = "Print the /dev/null notifications"
contexts = ["pane", "workspace"]
command = ["/bin/sh", "run.sh", "--once", "--log", "notifications"]
